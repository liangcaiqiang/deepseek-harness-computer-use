name: Bug 反馈
description: 报告可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请提供最小复现步骤。日志和截图请先移除密码、令牌、验证码及个人信息。
  - type: input
    id: version
    attributes:
      label: 插件版本或提交号
      description: 查看 package.json 的 version；从 Git 安装时也可提供提交号。
      placeholder: "例如：4.0.2 / 6a6ad09"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本与处理器
      placeholder: "例如：macOS 15.8，Apple Silicon"
    validations:
      required: true
  - type: input
    id: dsh
    attributes:
      label: DeepSeek Harness 版本
      description: 填写已安装的 @deepseek-ai/dsh 版本。
    validations:
      required: true
  - type: input
    id: target_app
    attributes:
      label: 目标应用及版本
      description: 如为构建或安装问题，可填写“不适用”。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 从启动到触发问题的最小步骤，附涉及的工具名。
      placeholder: |
        1. 启动 Harness 并加载插件
        2. 调用……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与错误信息
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 补充信息
      description: 可附脱敏后的构建日志、Helper 输出，以及辅助功能和屏幕录制权限是否已授予。
    validations:
      required: false
